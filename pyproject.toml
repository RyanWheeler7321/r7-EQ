[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "r7-eq"
version = "1.0"
description = "Small EQ app on top of Equalizer APO, with a profile for each playback device"
dependencies = [
    "PySide6>=6.8,<7",
    "numpy>=1.26,<3",
    "SoundCard>=0.4.6,<0.5; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
include = ["r7eq*"]
